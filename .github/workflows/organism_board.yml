name: Dashboard

# Scientist owns a bounded public development activity index. Owner repositories
# remain authoritative. Five-minute scheduling is best effort; the page exposes
# source coverage and event/collection times separately.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: organism-board-pages
  cancel-in-progress: false

jobs:
  board:
    name: Render + publish the dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The family look (hero, palette, stylesheet) is defined once in the
      # Brain and imported by the renderer — never copied in here.
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain

      # Canonical repository identity input; relationships remain in Scientist.
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoMind
          path: PyAutoMind

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pyyaml

      - name: Restore bounded activity index
        run: |
          mkdir -p _activity _site
          if git ls-remote --exit-code --heads origin refs/heads/scientist-activity-cache > /dev/null; then
            git fetch --depth 1 origin refs/heads/scientist-activity-cache
            git show FETCH_HEAD:cache.json > _activity/cache.json
            git rev-parse FETCH_HEAD > _activity/parent
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi

      # Cross-repo activity reads (issues, issue comments, PR details) use an
      # owner-wide read-only App token. No fallback to the workflow token: a
      # failed mint fails the run rather than silently shrinking coverage.
      - name: Mint App token (read-only, owner-wide)
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PyAutoLabs
          permission-issues: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Collect public development activity
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          python scripts/activity_feed.py --repos PyAutoMind/repos.yaml --cache _activity/cache.json --output _site/activity.json --budget 180

      - name: Preserve bounded derived index
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          activity_blob=$(git hash-object -w _activity/cache.json)
          activity_tree=$(printf '100644 blob %s\tcache.json\n' "$activity_blob" | git mktree)
          if [ -f _activity/parent ]; then
            activity_parent=$(cat _activity/parent)
            activity_commit=$(git commit-tree "$activity_tree" -p "$activity_parent" -m 'Refresh derived public activity index')
          else
            activity_commit=$(git commit-tree "$activity_tree" -m 'Begin derived public activity index')
          fi
          git push origin "$activity_commit:refs/heads/scientist-activity-cache"

      - name: Render every surface (public HTTPS only)
        run: |
          mkdir -p _site
          python scripts/organism_board.py --repos PyAutoMind/repos.yaml --activity _site/activity.json --html > _site/index.html
          python scripts/organism_board.py --repos PyAutoMind/repos.yaml --badge    > _site/badge.json
          python scripts/organism_board.py --repos PyAutoMind/repos.yaml --md       > board.md
          cp board.md _site/dashboard.md

      - name: Write the board to the job step summary
        run: cat board.md >> "$GITHUB_STEP_SUMMARY"

      # The Pages site is created once out-of-band (gh api -X POST
      # repos/<owner>/<repo>/pages -f build_type=workflow) — the default token
      # cannot create it here.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'
